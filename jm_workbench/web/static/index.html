<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>JM工作台</title>
    <link rel="stylesheet" href="/static/style.css" />
    <link rel="stylesheet" href="/static/data-page.css" />
    <link rel="stylesheet" href="/static/workbench.css" />
    <link rel="stylesheet" href="/static/community.css" />
    <link rel="stylesheet" href="/static/workspace.css" />
    <link rel="stylesheet" href="/static/workspace-modules.css" />
    <link rel="stylesheet" href="/static/community-v2.css" />
  </head>
  <body class="jm-workspace">
    <a class="skip-link" href="#content">跳转到主要内容</a>
    <div class="shell">
      <aside class="sidebar">
        <a class="brand" href="#tasks"
          ><span class="brand-mark">JM</span
          ><span>JM工作台<small>让每项任务有条不紊</small></span></a
        >
        <div class="nav-label">工作空间</div>
        <nav aria-label="主导航" id="nav"></nav>
        <div class="sidebar-bottom">
          <span class="status-dot"></span> 本机运行 · 数据保存在本地<small
            id="version"
            >正在连接服务</small
          >
        </div>
      </aside>
      <main>
        <header class="topbar">
          <div class="breadcrumb">
            <button
              class="icon-button community-mobile-menu"
              data-action="com-v2-menu"
              aria-label="打开导航"
              aria-expanded="false"
            >
              ☰
            </button>
            <span class="breadcrumb-prefix">我的工作空间 /</span>
            <strong id="page-label">工作概览</strong>
          </div>
          <div class="top-actions">
            <button
              class="button quiet community-density"
              data-action="com-v2-density"
            >
              紧凑 / 舒适
            </button>
            <button class="button quiet" data-action="refresh" title="刷新数据">
              ↻ 刷新</button
            ><button class="button" data-action="stop">Ⅱ 停止全部</button
            ><button class="button primary" data-action="launch">
              ▷ 执行评论 / 采集
            </button>
          </div>
        </header>
        <div class="content" id="content" tabindex="-1">
          <div class="empty">正在连接JM工作台…</div>
        </div>
        <footer>JM工作台 <span>任务、数据、内容发布，一处管理</span></footer>
      </main>
    </div>
    <div class="community-menu-shade" data-action="com-v2-menu"></div>
    <div id="toast" role="status" aria-live="polite" hidden></div>
    <dialog id="dialog" aria-labelledby="dialog-title">
      <div id="dialog-content"></div>
    </dialog>
    <script type="module" src="/static/app.js"></script>
  </body>
</html>
