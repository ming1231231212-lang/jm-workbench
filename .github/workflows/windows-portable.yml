name: Windows portable package
on:
  push:
    branches: ['codex/windows-portable-*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional existing draft release tag; dispatch from the same tag'
        required: false
        type: string
permissions:
  contents: read
jobs:
  portable:
    permissions:
      contents: write
    runs-on: windows-2025
    timeout-minutes: 30
    env:
      PYTHONUTF8: '1'
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/build/browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Source regression
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pytest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm test
      - name: Download official runtime and locked wheels
        run: |
          New-Item -ItemType Directory -Force build/downloads | Out-Null
          python -c "import urllib.request; urllib.request.urlretrieve('https://www.python.org/ftp/python/3.13.16/python-3.13.16-embed-amd64.zip', 'build/downloads/python-3.13.16-embed-amd64.zip')"
          python -m pip download --dest build/downloads/wheels --only-binary=:all: --python-version 3.13 --platform win_amd64 --implementation cp -r packaging/requirements-windows.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m playwright install chromium --no-shell
      - name: Preserve corresponding codec sources
        run: python packaging/collect_codec_sources.py build/downloads/codec-sources
      - name: Build portable package
        run: python packaging/build_windows.py --downloads build/downloads --browser build/browser --output build/JMWorkbench
      - name: Verify actual EXE and embedded runtime without developer PATH
        run: .\build\JMWorkbench\runtime\python.exe -B scripts/verify_portable.py --bundle build/JMWorkbench --output build/acceptance
      - name: Archive and upload the tested package to the draft release
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $tag = $env:RELEASE_TAG
          if ($tag -notmatch '^v\d+\.\d+\.\d+$' -or $env:GITHUB_REF -ne "refs/tags/$tag") { throw 'Dispatch must use the release tag itself' }
          $version = python -c "from jm_workbench import __version__; print(__version__)"
          if ($tag -ne "v$version") { throw 'Release tag does not match source version' }
          $release = gh release view $tag --json isDraft | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or -not $release.isDraft) { throw 'Only an existing draft may receive this build' }
          $zip = "build/JMWorkbench-$tag-windows-x64.zip"
          python packaging/archive_windows.py --bundle build/JMWorkbench --output $zip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release upload $tag $zip "$zip.sha256" 'build/acceptance/report.json' 'LICENSE' 'packaging/THIRD_PARTY_NOTICES.md'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload sanitized test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-portable-test-evidence
          path: |
            build/acceptance/report.json
            build/acceptance/*.png
          if-no-files-found: ignore
